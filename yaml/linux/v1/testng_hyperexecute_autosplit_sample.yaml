---
version: 0.1
runson: linux

autosplit: true
concurrency: 4

pre:
  - mvn dependency:resolve

testDiscovery:
  type: raw
  mode: remote
#  command: grep 'test name' xml/testng_linux.xml | awk '{print$2}' | sed 's/name=//g' | sed 's/>//g'
  command: cat test.txt

testRunnerCommand: mvn test -Dplatname=linux -Dmaven.repo.local=./.m2 dependency:resolve -DselectedTests=$test

retryOnFailure: true
maxRetries: 1

jobLabel: [selenium-testng, linux, v1, autosplit, sajdbajdjasdjsahdjkashjkdha]

project:
  id: ${project_id}

