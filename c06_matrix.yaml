version: 0.1
runson: ${matrix.os}

# C06 / RFC 9.8 P4 purest cross-group case.
# tests x browser => 4 groups. The "...=Test_1" name is shared by TWO groups (Chrome, Edge);
# Test_1 fails ONLY on Chrome and passes on Edge. Test_2 passes on both.
# => exactly 1 failed group (Test_1+Chrome). Failed-subset rerun must select ONLY that position,
# NOT the same-named passing Test_1+Edge group.
matrix:
  tests: ["Test_1", "Test_2"]
  browser: ["Chrome", "MicrosoftEdge"]
  version: ["latest"]
  os: ["linux"]

project:
  id: 01M3CG3FB031AFKD3K6GSPJT6M

pre:
  - mvn dependency:resolve -Dmaven.repo.local=m2_cache_dir

# browser exported so the surefire-forked test JVM inherits it (Test_1 reads System.getenv("browser")).
testSuites:
  - browser=$browser mvn test -Dplatname=linux -Dmaven.repo.local=m2_cache_dir -DselectedTests=$tests

parallelism: 1

retryOnFailure: false

jobLabel: [te27603-c06-matrix-pure]
