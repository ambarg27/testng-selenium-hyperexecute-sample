version: 0.1
runson: linux

# C06 / RFC 9.8 P4 cross-group positional selection (isolation run).
# testng_linux.xml is reduced to a single conditional test (MatrixCond) on this branch, so each
# matrix group runs only it. 3 groups, identical recorded unit name, distinct combination {variant};
# MatrixCond fails only when variant=b -> exactly the middle group fails.
matrix:
  variant: [a, b, c]

project:
  id: 01M3CG3FB031AFKD3K6GSPJT6M

pre:
  - mvn -q dependency:resolve -Dmaven.repo.local=./.m2

# variant exported so the surefire-forked test JVM inherits it (System.getenv).
testSuites:
  - variant=${matrix.variant} mvn test -Dplatname=linux -Dmaven.repo.local=./.m2

report: true
retryOnFailure: false
jobLabel: [te27603-c06-matrix]
